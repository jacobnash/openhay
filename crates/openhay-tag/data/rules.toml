# Canonical words (see lexicon.toml) -> Haystack 4 tags.
#
# A rule matches when all of its `match` words are present. When several
# rules match, the winner is the one that:
#   1. explains the most of the point's name tokens;
#   2. then has the most `match` words;
#   3. then uses the most unit or object-type signals;
#   4. then comes first in this file.
# So `SUP-FAN-STA` is fan status, not just "fan", and `FIR-RAT` (firing
# rate) beats return air temp, which `rat` alone would mean.
#
# Tags are Haystack 4 marker names, checked against the defs bundled in
# openhay-defs: `discharge`, never `supply`, for air; `leaving`/`entering`
# for water. The `point` marker is left to the caller. A rule with
# `tags = []` claims the words but gives no tags: it's for things Haystack
# 4 has no tag for (a boiler's firing rate), so they don't fall through to
# a wrong guess.
#
# When a result has no function tag (sensor, cmd or sp), the BACnet object
# type supplies one: inputs give `sensor`, outputs give `cmd`.
#
# Site overrides use the same `[[rule]]` tables. A rule with an existing
# `id` replaces it; a new `id` is added.

# ---------------------------------------------------------------- air temps
[[rule]]
id = "discharge-air-temp"
match = ["discharge", "temp"]
tags = ["discharge", "air", "temp", "sensor"]

[[rule]]
id = "supply-air-temp"
match = ["supply", "temp"]
tags = ["discharge", "air", "temp", "sensor"]

[[rule]]
id = "return-air-temp"
match = ["return", "temp"]
tags = ["return", "air", "temp", "sensor"]

[[rule]]
id = "mixed-air-temp"
match = ["mixed", "temp"]
tags = ["mixed", "air", "temp", "sensor"]

[[rule]]
id = "outside-air-temp"
match = ["outside", "temp"]
tags = ["outside", "air", "temp", "sensor"]

[[rule]]
id = "exhaust-air-temp"
match = ["exhaust", "temp"]
tags = ["exhaust", "air", "temp", "sensor"]

[[rule]]
id = "zone-air-temp"
match = ["zone", "temp"]
tags = ["zone", "air", "temp", "sensor"]

[[rule]]
id = "discharge-air-temp-sp"
match = ["discharge", "temp", "sp"]
tags = ["discharge", "air", "temp", "sp"]

[[rule]]
id = "supply-air-temp-sp"
match = ["supply", "temp", "sp"]
tags = ["discharge", "air", "temp", "sp"]

[[rule]]
id = "zone-air-temp-sp"
match = ["zone", "temp", "sp"]
tags = ["zone", "air", "temp", "sp"]

[[rule]]
id = "zone-air-temp-occ-sp"
match = ["zone", "temp", "sp", "occupied"]
tags = ["zone", "air", "temp", "occ", "sp"]

[[rule]]
id = "zone-air-temp-unocc-sp"
match = ["zone", "temp", "sp", "unoccupied"]
tags = ["zone", "air", "temp", "unocc", "sp"]

[[rule]]
id = "zone-air-temp-cooling-sp"
match = ["zone", "temp", "sp", "cooling"]
tags = ["zone", "air", "temp", "cooling", "sp"]

[[rule]]
id = "zone-air-temp-heating-sp"
match = ["zone", "temp", "sp", "heating"]
tags = ["zone", "air", "temp", "heating", "sp"]

[[rule]]
id = "zone-air-temp-occ-cooling-sp"
match = ["zone", "temp", "sp", "occupied", "cooling"]
tags = ["zone", "air", "temp", "occ", "cooling", "sp"]

[[rule]]
id = "zone-air-temp-occ-heating-sp"
match = ["zone", "temp", "sp", "occupied", "heating"]
tags = ["zone", "air", "temp", "occ", "heating", "sp"]

[[rule]]
