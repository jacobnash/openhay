# -------------------------------------------- one word, from units or name
# Low-specificity fallbacks, so a point named `AI-17` with units of °F
# still gets something. Any rule naming more than the quantity wins.
[[rule]]
id = "temp"
match = ["temp"]
tags = ["temp", "sensor"]

[[rule]]
id = "pressure"
match = ["pressure"]
tags = ["pressure", "sensor"]

[[rule]]
id = "flow"
match = ["flow"]
tags = ["flow", "sensor"]
