cond = ["condenser"]
cnd = ["condenser"]
con = ["condenser"]
cdw = ["condenser", "water"]
lvg = ["leaving"]
lwt = ["leaving", "water", "temp"]
ent = ["entering"]
ewt = ["entering", "water", "temp"]

# equipment
