dmpr = ["damper"]
dam = ["damper"]
dpr = ["damper"]
vlv = ["valve"]
vlve = ["valve"]
fn = ["fan"]
sf = ["supply", "fan"]
rf = ["return", "fan"]
ef = ["exhaust", "fan"]
pmp = ["pump"]
pum = ["pump"]
chi = ["chiller"]
chlr = ["chiller"]
