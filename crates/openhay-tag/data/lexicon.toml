# BAS abbreviations and synonyms -> canonical words, the vocabulary
# rules.toml matches on. Keys are lowercase tokens as the tokenizer emits
# them (`CHWSupTmp3` -> chw sup tmp 3).
#
# - One token can stand for several words: `sat` is discharge air temp.
# - An ambiguous token lists every reading: `sta` is status, static or
#   start. The matcher prefers the rule that explains the most tokens, so
#   `SUP-FAN-STA` reads as fan status and `STA-PRE` as static pressure.
# - A canonical word used in rules.toml needs no entry of its own; `temp`
#   means temp.
# - Site overrides use the same table. An entry replaces the default, and
#   an empty list (`foo = []`) removes it.

[words]
# what is measured
tmp = ["temp"]
tem = ["temp"]
tmpr = ["temp"]
temperature = ["temp"]
t = ["temp"]
hum = ["humidity"]
humid = ["humidity"]
rh = ["humidity"]
pre = ["pressure"]
pres = ["pressure"]
press = ["pressure"]
prs = ["pressure"]
pr = ["pressure"]
dp = ["differential", "pressure"]
dsp = ["discharge", "static", "pressure"]
flw = ["flow"]
airflow = ["air", "flow"]
cfm = ["air", "flow"]
spd = ["speed"]
pos = ["position"]
posn = ["position"]
kw = ["elec", "power"]
kwh = ["elec", "energy"]
dem = ["demand"]
tot = ["total"]
ttl = ["total"]
inp = ["input"]

# where: air
sup = ["supply"]
sply = ["supply"]
supp = ["supply"]
ret = ["return"]
rtn = ["return"]
dis = ["discharge"]
dsch = ["discharge"]
disch = ["discharge"]
dischg = ["discharge"]
mix = ["mixed"]
mxd = ["mixed"]
out = ["outside"]
outdoor = ["outside"]
osa = ["outside", "air"]
exh = ["exhaust"]
zn = ["zone"]
zon = ["zone"]
space = ["zone"]
spc = ["zone"]
rm = ["zone"]
room = ["zone"]
sa = ["supply", "air"]
ra = ["return", "air"]
ma = ["mixed", "air"]
oa = ["outside", "air"]
ea = ["exhaust", "air"]
da = ["discharge", "air"]
sat = ["supply", "air", "temp"]
dat = ["discharge", "air", "temp"]
mat = ["mixed", "air", "temp"]
oat = ["outside", "air", "temp"]
eat = ["exhaust", "air", "temp"]
# `rat` is return air temp, or the `rate` in a firing rate.
rat = ["return", "air", "temp", "rate"]
znt = ["zone", "temp"]
zt = ["zone", "temp"]
zat = ["zone", "air", "temp"]
rmt = ["zone", "temp"]

# where: water
wtr = ["water"]
chw = ["chilled", "water"]
chws = ["chilled", "water", "supply"]
chwr = ["chilled", "water", "return"]
hw = ["hot", "water"]
hws = ["hot", "water", "supply"]
hwr = ["hot", "water", "return"]
