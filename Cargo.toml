[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/openhay-codec",
    "crates/openhay-auth",
    "crates/openhay-client",
    "crates/openhay-filter",
    "crates/openhay-defs",
    "crates/openhay-server",
    "crates/hay-cli",
    "crates/openhay-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/jacobnash/openhay"
rust-version = "1.85"

[workspace.dependencies]
libhaystack = { version = "4.1", default-features = false, features = ["encoders", "filter", "timezone", "units", "units-db"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
openhay-codec = { path = "crates/openhay-codec" }
openhay-auth = { path = "crates/openhay-auth" }
openhay-client = { path = "crates/openhay-client" }
openhay-filter = { path = "crates/openhay-filter" }
openhay-defs = { path = "crates/openhay-defs" }
openhay-server = { path = "crates/openhay-server" }
